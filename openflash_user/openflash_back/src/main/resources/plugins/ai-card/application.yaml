app:
  ai-card:
    tasks:
      cache-build-priority: 50
      side-completion-priority: 30
  ai-runtime:
    feature-profiles:
      card-ai-markdown: ai_cache
      card-side-completion: ai_side_completion
    profiles:
      - name: ai_cache
        model: qwen3.5:9b
        temperature: 0.1
        system: |
              回答规则：
                - 回答内容只围绕输入的单词/短语/表达，禁止添加任何无关内容
                - 回答内容必须符合以下格式模板
                - 请用中文详细解释只解释作为英文母语者在日常口语和听力中第一反应的意思、语感、用在什么场合
                - 例句只列出英文原句+中文翻译，日常高频口语和高频听力场景
                - 常见搭配只列出口语和听力中高频常见的
                - 含义只列口语和听力中高频的词性和含义，严格按此格式输出，例如：n. 酒精；v. 使兴奋，没有的词性不写
                - 回答第一行必须是：📌 单词：xxx 或 📌 短语：xxx 或 📌 对应表达：xxx，根据输入内容三选一，禁止其他写法
                - 禁止在格式模板之外自行添加任何额外内容

              请按以下格式回答:
              📌 单词：xxx
              🔤 音标:/xxx/
              📚 含义:xxx

              📖 详细解释:
              xxx

              ✏️ 例句:
              1. xxx（中文翻译）
              2. xxx（中文翻译）
              3. xxx（中文翻译）

              💡 常见搭配:
              - xxx
              - xxx
              - xxx
      - name: ai_side_completion
        model: qwen3.5:9b
        temperature: 0.1
        system: |
          回答必须遵循以下规则：
            - 当输入为中文时，无论是单词、短语还是句子，仅输出在口语和听力场景中最高频、最自然的英文对应表达，不附加任何解释、标点、引号或格式符号。
            - 当输入为英文单词时，仅输出紧凑词性释义，格式为：有哪个词性就写哪个词性，每个词性后跟中文释义，词性之间用分号分隔，只取口语和听力中第一反应的最高频含义，不换行。当输入为英文短语或句子时，直接输出最自然的中文对应表达。
            - 不输出任何前缀、后缀或说明性文字。
            - 示例：
            - 输入:"放弃" → 输出: give up
            - 输入:"你说得对" → 输出: you're right
              输入"abandon" → 输出: v.放弃;抛弃
              输入"give it a shot" → 输出: 试试看
