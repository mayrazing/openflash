name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend / ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: User
            path: openflash_user/openflash_back
          - name: Admin
            path: openflash_admin/admin_back
          - name: AI Runtime
            path: openflash_ai_runtime
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: openflash_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      OPENFLASH_POSTGRESQL_CONTRACT_URL: jdbc:postgresql://127.0.0.1:5432/openflash_db
      OPENFLASH_POSTGRESQL_CONTRACT_USER: postgres
      OPENFLASH_POSTGRESQL_CONTRACT_PASSWORD: root
      OPENFLASH_ADMIN_PLATFORM_AI_MAPPER_CONTRACT_TEST: "true"
      OPENFLASH_AI_RUNTIME_MAPPER_CONTRACT_TEST: "true"
      OPENFLASH_CORE_MAPPER_CONTRACT_TEST: "true"
      OPENFLASH_CARD_SIDE_COMPLETION_INTEGRATION_TEST: "true"
      JAVA_TOOL_OPTIONS: -Dopenflash.migration.postgresql.enabled=true
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            ${{ matrix.path }}/build.gradle.kts
            ${{ matrix.path }}/settings.gradle.kts
            ${{ matrix.path }}/gradle/wrapper/gradle-wrapper.properties

      - name: Run backend tests
        working-directory: ${{ matrix.path }}
        run: ./gradlew test --no-daemon

  node:
    name: Node / ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: User Frontend
            path: openflash_user/openflash_front
            kind: frontend
          - name: Admin Frontend
            path: openflash_admin/admin_front
            kind: frontend
          - name: Browser Extension
            path: openflash_browser_extension
            kind: extension
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.path }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.path }}
        run: npm ci

      - name: Lint
        working-directory: ${{ matrix.path }}
        run: npm run lint

      - name: Run unit tests
        working-directory: ${{ matrix.path }}
        run: npm test

      - name: Build frontend
        if: matrix.kind == 'frontend'
        working-directory: ${{ matrix.path }}
        run: npm run build

      - name: Verify extension theme
        if: matrix.kind == 'extension'
        working-directory: ${{ matrix.path }}
        run: npm run theme:check

      - name: Build and verify extension output
        if: matrix.kind == 'extension'
        working-directory: ${{ matrix.path }}
        run: npm run test:build

  e2e:
    name: E2E / ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: User Frontend
            path: openflash_user/openflash_front
            kind: frontend
          - name: Browser Extension
            path: openflash_browser_extension
            kind: extension
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.path }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.path }}
        run: npm ci

      - name: Install Chromium
        working-directory: ${{ matrix.path }}
        run: npx --no-install playwright install --with-deps chromium

      - name: Run frontend E2E tests
        if: matrix.kind == 'frontend'
        working-directory: ${{ matrix.path }}
        run: npm run test:e2e:responsive

      - name: Build browser extension
        if: matrix.kind == 'extension'
        working-directory: ${{ matrix.path }}
        run: npm run build

      - name: Run browser extension E2E tests
        if: matrix.kind == 'extension'
        working-directory: ${{ matrix.path }}
        run: npm run test:e2e

  python:
    name: Python / ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Piper
            path: openflash_user/piper_tts_service
            python-version: "3.12"
            kind: piper
          - name: CosyVoice3 Lightweight
            path: openflash_user/cosyvoice3_tts_service
            python-version: "3.10"
            kind: cosyvoice
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Piper dependencies
        if: matrix.kind == 'piper'
        working-directory: ${{ matrix.path }}
        run: python -m pip install -r requirements.txt

      - name: Run Piper tests
        if: matrix.kind == 'piper'
        working-directory: ${{ matrix.path }}
        run: python -m unittest discover -s . -p 'test_*.py'

      - name: Install CosyVoice3 lightweight dependencies
        if: matrix.kind == 'cosyvoice'
        run: python -m pip install cmudict==1.1.1

      - name: Run CosyVoice3 lightweight tests
        if: matrix.kind == 'cosyvoice'
        working-directory: ${{ matrix.path }}
        run: python -m unittest test_pronunciation.py test_prepare_runtime.py

  ci-gate:
    name: CI Gate
    if: always()
    needs:
      - backend
      - node
      - e2e
      - python
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job to pass
        run: |
          test "${{ needs.backend.result }}" = "success"
          test "${{ needs.node.result }}" = "success"
          test "${{ needs.e2e.result }}" = "success"
          test "${{ needs.python.result }}" = "success"
